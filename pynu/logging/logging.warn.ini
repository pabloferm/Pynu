[loggers]
keys=root

[handlers]
keys=console

[formatters]
keys=console

[logger_root]
level=WARNING
handlers=console

[handler_console]
class=StreamHandler
level=WARNING
formatter=console
args=(sys.stdout,)

[formatter_console]
format=%(asctime)s - %(levelname)s - %(name)s - %(funcName)s:%(lineno)d - %(message)s
